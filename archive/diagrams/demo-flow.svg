<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250">
<title>Demo Day walkthrough</title>
<desc>Five-step timeline of the live demo: upload, confirm, reject double financing on-chain, settle, close.</desc>
<rect x="0" y="0" width="980" height="250" fill="#FFFFFF"/>
<text x="490.0" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C2C2A">FMCG Receivables Passport — Demo Day walkthrough</text>
<text x="490.0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">What happens on stage, in three minutes</text>
<rect x="40" y="90" width="160" height="100" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="120.0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5F5E5A">0:00</text>
<text x="120.0" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Upload</text>
<text x="120.0" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Invoice submitted</text>
<text x="120.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">AI flags issues</text>
<line x1="204" y1="140" x2="212" y2="140" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="221,140 211,135 211,145" fill="#5F5E5A"/>
<rect x="225" y="90" width="160" height="100" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="305.0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5F5E5A">0:45</text>
<text x="305.0" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Confirm</text>
<text x="305.0" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Buyer confirms</text>
<text x="305.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">2nd wallet, on-chain</text>
<line x1="389" y1="140" x2="397" y2="140" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="406,140 396,135 396,145" fill="#5F5E5A"/>
<rect x="410" y="90" width="160" height="100" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="490.0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#712B13">1:30</text>
<text x="490.0" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Reject</text>
<text x="490.0" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#712B13">2nd funder blocked</text>
<text x="490.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#712B13">live, on-chain</text>
<line x1="574" y1="140" x2="582" y2="140" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="591,140 581,135 581,145" fill="#5F5E5A"/>
<rect x="595" y="90" width="160" height="100" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="675.0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5F5E5A">2:15</text>
<text x="675.0" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Settle</text>
<text x="675.0" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Funder settles</text>
<text x="675.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">test token, on-chain</text>
<line x1="759" y1="140" x2="767" y2="140" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="776,140 766,135 766,145" fill="#5F5E5A"/>
<rect x="780" y="90" width="160" height="100" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
