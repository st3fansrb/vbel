<text x="860.0" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Registry today</text>
<text x="860.0" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">marketplace next</text>
<text x="490.0" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Each box is what the jury sees happen live, in order</text>
