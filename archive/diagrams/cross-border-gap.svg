<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<title>Cross-border gap map</title>
<desc>Two territory boxes, Serbia and Romania, each with a national registry covering only domestic invoices, and a highlighted gap in between for cross-border invoices where the product operates.</desc>
<rect x="0" y="0" width="1000" height="420" fill="#FFFFFF"/>
<text x="500.0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C2C2A">The cross-border gap - why the corridor is the opportunity</text>
<text x="500.0" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">National registries (2025-26) solve domestic double financing. Neither covers invoices crossing the border.</text>
<rect x="40" y="70" width="320" height="300" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="200" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#042C53">Serbia</text>
<text x="200" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0C447C">Central Factoring Registry (CFR)</text>
<text x="200" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Live since December 2025</text>
<text x="200" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Covers domestic invoices only</text>
<text x="200" y="221" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Does not see cross-border deals</text>
<rect x="640" y="70" width="320" height="300" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="800" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#042C53">Romania</text>
<text x="800" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0C447C">National Pledge Registry (RNPM)</text>
<text x="800" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Existing registry</text>
<text x="800" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Covers domestic invoices only</text>
<text x="800" y="221" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">- Does not see cross-border deals</text>
<rect x="390" y="130" width="220" height="180" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="500" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#412402">Cross-border gap</text>
<text x="500" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#633806">Serbia / Romania invoices</text>
<text x="500" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#633806">Not covered by either</text>
<text x="500" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#633806">registry</text>
<text x="500" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#412402">We operate here</text>
<line x1="364" y1="220" x2="377" y2="220" stroke="#854F0B" stroke-width="1.5"/><polygon points="386,220 376,215 376,225" fill="#854F0B"/>
<line x1="614" y1="220" x2="627" y2="220" stroke="#854F0B" stroke-width="1.5"/><polygon points="636,220 626,215 626,225" fill="#854F0B"/>
<text x="500.0" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5F5E5A">Sources: Serbia Official Gazette 109/2025 (CFR); Romania RNPM</text>
</svg>